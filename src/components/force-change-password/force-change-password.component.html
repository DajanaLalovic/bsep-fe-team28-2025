<div class="reset-container">
  <h2>Change Your Password</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">

    <label>New Password</label>
    <input
      type="password"
      formControlName="newPassword"
      placeholder="Enter new password"
      (input)="onPasswordInput()"
    >

    <!-- Strength bar (identičan reset komponenti) -->
    <div class="strength">
      <div class="bar" [class.active]="strength > 0"></div>
      <div class="bar" [class.active]="strength > 1"></div>
      <div class="bar" [class.active]="strength > 2"></div>
      <div class="bar" [class.active]="strength > 3"></div>
      <div class="bar" [class.active]="strength > 4"></div>
    </div>

    <label>Confirm Password</label>
    <input
      type="password"
      formControlName="confirmPassword"
      placeholder="Confirm new password"
    >

    <!-- Match validation -->
    <p class="error"
       *ngIf="form.value.newPassword !== form.value.confirmPassword
              && form.get('confirmPassword')?.touched">
      Passwords do not match
    </p>

    <button type="submit" [disabled]="loading || form.invalid">
      {{ loading ? 'Updating...' : 'Update Password' }}
    </button>

  </form>

  <div class="success" *ngIf="success">
    {{ success }}
  </div>

  <div class="error" *ngIf="error">
    {{ error }}
  </div>
</div>

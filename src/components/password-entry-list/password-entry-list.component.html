<div class="password-list">
  <h2>Your Saved Passwords</h2>
  <table>
    <thead>
      <tr>
        <th>Site</th>
        <th>Username</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let entry of entries">
        <td>{{ entry.siteName }}</td>
        <td>{{ entry.username }}</td>
        <td>
          <button *ngFor="let share of entry.shares" (click)="decryptPassword(share)">
            Decrypt for User {{ share.userId }}
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

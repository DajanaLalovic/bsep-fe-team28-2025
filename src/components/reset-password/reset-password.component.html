<div class="reset-container">
  <h2>Reset Password</h2>

  <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
    <label>New Password</label>
    <input type="password" formControlName="newPassword" placeholder="Enter new password" (input)="onPasswordInput()">

    <div class="strength">
      <div class="bar" [class.active]="strength > 0"></div>
      <div class="bar" [class.active]="strength > 1"></div>
      <div class="bar" [class.active]="strength > 2"></div>
      <div class="bar" [class.active]="strength > 3"></div>
      <div class="bar" [class.active]="strength > 4"></div>
    </div>

    <label>Confirm Password</label>
    <input type="password" formControlName="confirmPassword" placeholder="Confirm new password">

    <p class="reset-error" *ngIf="resetForm.value.newPassword !== resetForm.value.confirmPassword && resetForm.get('confirmPassword')?.touched">
      Passwords do not match
    </p>

    <button type="submit" [disabled]="loading || resetForm.invalid">
      {{ loading ? 'Resetting...' : 'Reset Password' }}
    </button>
  </form>

  <div class="reset-success" *ngIf="success">{{ success }}</div>
  <div class="reset-error" *ngIf="error">{{ error }}</div>
</div>
